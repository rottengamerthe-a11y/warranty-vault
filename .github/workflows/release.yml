name: Build & Release AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build_release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore (from secret KEYSTORE_BASE64)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./keystore.jks
          else
            echo "No KEYSTORE_BASE64 secret provided — skipping keystore decode"
          fi

      - name: Create keystore.properties
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            cat > keystore.properties <<EOF
storeFile=keystore.jks
storePassword=${{ secrets.STORE_PASSWORD }}
keyAlias=${{ secrets.KEY_ALIAS }}
keyPassword=${{ secrets.KEY_PASSWORD }}
EOF
          else
            echo "No keystore secret — not generating keystore.properties"
          fi

      - name: Grant execute for gradlew
        run: chmod +x ./gradlew

      - name: Build release AAB
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload AAB to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # Upload to Google Play removed from this workflow to avoid needing
      # Play credentials during automated testing. Re-add a secure upload
      # step in a separate, protected workflow when ready.

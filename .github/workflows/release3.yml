name: Release Try 3

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore via env
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf "%s" "$KEYSTORE_BASE64" | base64 --decode > ./app/warrantyvault-keystore.jks
            printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$(pwd)/app/warrantyvault-keystore.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          else
            echo "No keystore secret provided"
          fi

      - name: Grant execute for gradlew
        run: chmod +x ./gradlew

      - name: Build release AAB
        env:
          GRADLE_OPTS: -Xmx1024m
        run: ./gradlew :app:bundleRelease --no-daemon
